name: build

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build and smoke-test package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: st_sigma/frontend/package-lock.json

      - name: Build frontend
        working-directory: st_sigma/frontend
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Auto-generate examples/requirements.txt
        run: |
          VERSION=$(uv run python -c "
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          print(tomllib.loads(open('pyproject.toml').read())['project']['version'])
          ")
          cat <<EOF > examples/requirements.txt
          streamlit-sigmajs==${VERSION}
          networkx>=3.2
          pandas>=2.0
          EOF

      - name: Commit & push updated examples/requirements.txt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync examples/requirements.txt [skip ci]"
          file_pattern: "examples/requirements.txt"

      - name: Run Python tests
        run: uv run --extra dev pytest

      - name: Build Python distributions
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Smoke-test the wheel
        run: |
          uv venv "${RUNNER_TEMP}/smoke-venv"
          uv pip install --python "${RUNNER_TEMP}/smoke-venv/bin/python" dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/smoke-venv/bin/python" -c "import st_sigma; print(st_sigma.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
