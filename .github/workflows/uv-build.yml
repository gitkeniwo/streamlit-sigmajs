name: build

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build and smoke-test package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: st_sigma/frontend/package-lock.json

      - name: Build frontend
        working-directory: st_sigma/frontend
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run Python tests
        run: uv run --extra dev pytest

      - name: Build Python distributions
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Smoke-test the wheel
        run: |
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/*.whl
          .smoke-venv/bin/python -c "import st_sigma; print(st_sigma.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
