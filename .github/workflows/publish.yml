name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: st_sigma/frontend/package-lock.json

      - name: Build frontend
        working-directory: st_sigma/frontend
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run Python tests
        run: uv run --extra dev pytest

      - name: Build Python distributions
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Smoke-test the wheel
        run: |
          uv venv "${RUNNER_TEMP}/smoke-venv"
          uv pip install --python "${RUNNER_TEMP}/smoke-venv/bin/python" dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/smoke-venv/bin/python" -c "import st_sigma; print(st_sigma.__file__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/streamlit-sigmajs
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 -c "
          import re
          tag = '${{ github.ref_name }}'.lstrip('v')
          content = open('CHANGELOG.md').read()
          pattern = rf'## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              open('release_notes.md', 'w').write(match.group(1).strip() + '\n')
          "

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "streamlit-sigmajs ${{ github.ref_name }}"
          body_path: release_notes.md
          files: dist/*
          generate_release_notes: true
