[project]
name = "streamlit-sigmajs"
version = "0.2.0"
description = "Interactive property graph visualization for Streamlit, powered by Sigma.js"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "gitkeniwo" },
]
license-files = ["LICENSE"]
dependencies = [
    "streamlit>=1.51.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "networkx>=3.2",
    "pandas>=2.0",
    "pytest>=8.0",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=5.0",
]
examples = [
    "networkx>=3.2",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/gitkeniwo/streamlit-sigmajs"
Repository = "https://github.com/gitkeniwo/streamlit-sigmajs"
Issues = "https://github.com/gitkeniwo/streamlit-sigmajs/issues"
Changelog = "https://github.com/gitkeniwo/streamlit-sigmajs/blob/main/CHANGELOG.md"


[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["st_sigma*"]

[tool.setuptools.package-data]
st_sigma = ["pyproject.toml", "frontend/build/*", "frontend/build/**/*"]
